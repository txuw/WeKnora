name: Mirror personal infrastructure to ACR

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/personal-infra.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weknora-personal-infrastructure
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: milvusdb/milvus:v2.2.13
            target: weknora-milvus:v2.2.13
          - source: milvusdb/milvus:v2.5.27
            target: weknora-milvus:v2.5.27
          - source: milvusdb/milvus:v2.6.11
            target: weknora-milvus:v2.6.11
          - source: milvusdb/etcd:3.5.5-r2
            target: weknora-milvus-etcd:3.5.5-r2
          # The legacy upstream repository is unavailable. This exact version
          # was recovered from the running node cache, then mirrored to ACR.
          - source: registry.cn-hangzhou.aliyuncs.com/txuw/weknora-milvus-minio:RELEASE.2023-03-20T20-16-18Z
            target: weknora-milvus-minio:RELEASE.2023-03-20T20-16-18Z
          - source: milvusdb/milvus-config-tool:v0.1.1
            target: weknora-milvus-config-tool:v0.1.1
    steps:
      - uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Copy the pinned amd64 image
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: registry.cn-hangzhou.aliyuncs.com/txuw/${{ matrix.target }}
        run: |
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
          docker image inspect "$TARGET_IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
